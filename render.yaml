# Render blueprint for the backend deployables.
# The frontend (apps/web) deploys on Vercel (see apps/web/vercel.json); this
# file covers the two long-running Node services that Vercel cannot host.
#
# Both build from the repo root so pnpm can resolve the @corgi/* workspace
# packages, then Turborepo compiles each deployable and its dependencies.
# Secrets use `sync: false` (set them in the Render dashboard); names match
# the Zod schemas in apps/api/src/config.ts and apps/worker/src/config.ts.
services:
  # Fastify HTTP API: REST, Plaid/Persona webhooks, and the MCP endpoint.
  - type: web
    name: corgi-api
    runtime: node
    plan: starter # webhooks + MCP need an always-on instance; free tier spins down.
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@corgi/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT_NAME
        value: sandbox # shown as a badge in the customer UI; "production" hides it
      - key: WEB_ORIGIN
        sync: false # the Vercel web URL, for CORS
      - key: DATABASE_URL
        sync: false # Neon pooled URL (HTTP reads)
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon direct URL (deposits and orders run in interactive transactions)
      - key: SESSION_SECRET
        generateValue: true # ≥32 chars; rotating it signs every customer out
      - key: MCP_API_KEY
        sync: false
      - key: LIVE_FIRE_TOKEN
        generateValue: true # operator token for /v1/ops/*; rotating it closes every operator session
      - key: ALPACA_KEY
        sync: false # customer account creation and order placement from chooseModel
      - key: ALPACA_SECRET
        sync: false
      - key: ALPACA_SANDBOX_ACCOUNT_ID
        sync: false # optional: dashboard-created sandbox account used when POST /v1/accounts answers 403
      - key: ALPACA_MARKET_DATA_BASE_URL
        value: https://data.sandbox.alpaca.markets # daily bars for the live-fire "collect closes" action
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PERSONA_API_KEY
        sync: false
      - key: PERSONA_TEMPLATE_ID
        sync: false
      - key: PERSONA_WEBHOOK_SECRET
        sync: false

  # Alpaca SSE consumer, inbox processor, and cron (valuation/recon/settlement).
  # Background workers are a paid service on Render (no free tier); keep it always-on.
  - type: worker
    name: corgi-worker
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@corgi/worker
    startCommand: node apps/worker/dist/main.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled URL (HTTP reads)
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon direct URL (ledger transactions)
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: ALPACA_MARKET_DATA_BASE_URL
        value: https://data.sandbox.alpaca.markets # nightly close collection (20:15 ET)
      - key: VALUATION_LOOKBACK_DAYS
        value: "7" # business days re-pulled each night so provider corrections restate automatically
      - key: PLAID_CLIENT_ID
        sync: false # enables the /transfer/event/sync loop; without it deposits never settle
      - key: PLAID_SECRET
        sync: false
